name: Build & Distribute via Firebase (App Distribution & Hosting)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas de la versión para los testers en Firebase'
        required: false
        default: 'Nueva versión de Endomondo Neo con GPS, Audio Coach, Sensores BLE y Amigos'
  push:
    branches: [main]

jobs:
  build-and-distribute:
    name: Build APK & Publish to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools 34 & Platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile & Sign EndomondoNeo.apk
        run: |
          BT_DIR="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          cd android-apk-build
          mkdir -p obj bin compiled_res assets/www
          cp ../web-panel/index.html ../web-panel/styles.css ../web-panel/app.js ../web-panel/manifest.json ../web-panel/sw.js assets/www/
          "$BT_DIR/aapt2" compile --dir res -o compiled_res/res.zip
          "$BT_DIR/aapt2" link -I "$ANDROID_JAR" --manifest AndroidManifest.xml -A assets --java obj --min-sdk-version 26 --target-sdk-version 34 -o bin/EndomondoNeo.unaligned.apk compiled_res/res.zip
          javac -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" -d obj src/com/endomondoneo/app/MainActivity.java obj/com/endomondoneo/app/R.java
          "$BT_DIR/d8" --lib "$ANDROID_JAR" --output bin obj/com/endomondoneo/app/*.class
          cd bin && zip -q EndomondoNeo.unaligned.apk classes.dex
          "$BT_DIR/zipalign" -p -f 4 EndomondoNeo.unaligned.apk EndomondoNeo.aligned.apk
          keytool -genkeypair -v -keystore release.jks -alias endomondo-neo -keyalg RSA -keysize 2048 -validity 10000 -storepass endomondo123 -keypass endomondo123 -dname "CN=Endomondo Neo, OU=Mobile, O=EndomondoNeo, L=Madrid, S=Madrid, C=ES"
          "$BT_DIR/apksigner" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --ks release.jks --ks-pass pass:endomondo123 --key-pass pass:endomondo123 --out ../../web-panel/EndomondoNeo.apk EndomondoNeo.aligned.apk
          cp ../../web-panel/EndomondoNeo.apk ../../EndomondoNeo.apk

      - name: Upload Compiled APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EndomondoNeo-Firebase-APK
          path: EndomondoNeo.apk

      - name: Upload APK to Firebase App Distribution (if credentials configured)
        if: ${{ secrets.FIREBASE_ANDROID_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: EndomondoNeo.apk
          releaseNotes: ${{ github.event.inputs.release_notes || 'Nueva versión automática desde GitHub main' }}

      - name: Deploy Web App & APK Download Page to Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: endomondo-neo
